<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 110" width="640" height="110" font-family="sans-serif" font-size="16">
  <title>Číselná osa od −5 do 5</title>
  <!-- bílé pozadí, aby byl obrázek čitelný i v tmavém režimu GitHubu -->
  <rect width="640" height="110" fill="#ffffff"/>
  <!-- šipky na koncích osy -->
  <defs>
    <marker id="sipka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <line x1="20" y1="55" x2="620" y2="55" stroke="#222" stroke-width="2" marker-start="url(#sipka)" marker-end="url(#sipka)"/>
  <!-- dílky po 55 px: −5 je na x=45, 0 na x=320, 5 na x=595 -->
  <g stroke="#222" stroke-width="2">
    <line x1="45" y1="47" x2="45" y2="63"/><line x1="100" y1="47" x2="100" y2="63"/>
    <line x1="155" y1="47" x2="155" y2="63"/><line x1="210" y1="47" x2="210" y2="63"/>
    <line x1="265" y1="47" x2="265" y2="63"/><line x1="320" y1="42" x2="320" y2="68"/>
    <line x1="375" y1="47" x2="375" y2="63"/><line x1="430" y1="47" x2="430" y2="63"/>
    <line x1="485" y1="47" x2="485" y2="63"/><line x1="540" y1="47" x2="540" y2="63"/>
    <line x1="595" y1="47" x2="595" y2="63"/>
  </g>
  <!-- popisky: záporná čísla červeně, kladná modře, nula černě -->
  <g text-anchor="middle">
    <text x="45" y="88" fill="#c0392b">−5</text><text x="100" y="88" fill="#c0392b">−4</text>
    <text x="155" y="88" fill="#c0392b">−3</text><text x="210" y="88" fill="#c0392b">−2</text>
    <text x="265" y="88" fill="#c0392b">−1</text><text x="320" y="88" fill="#222" font-weight="bold">0</text>
    <text x="375" y="88" fill="#1f5fa8">1</text><text x="430" y="88" fill="#1f5fa8">2</text>
    <text x="485" y="88" fill="#1f5fa8">3</text><text x="540" y="88" fill="#1f5fa8">4</text>
    <text x="595" y="88" fill="#1f5fa8">5</text>
  </g>
  <text x="160" y="28" text-anchor="middle" fill="#c0392b" font-size="14">záporná čísla</text>
  <text x="480" y="28" text-anchor="middle" fill="#1f5fa8" font-size="14">kladná čísla</text>
</svg>
