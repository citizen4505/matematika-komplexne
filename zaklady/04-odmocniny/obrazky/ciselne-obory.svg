<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="sans-serif" font-size="16">
  <title>Číselné obory do sebe vnořené: N uvnitř Z uvnitř Q uvnitř R; iracionální čísla jsou v R mimo Q</title>
  <!-- bílé pozadí kvůli tmavému režimu GitHubu -->
  <rect width="600" height="300" fill="#ffffff"/>
  <!-- R – reálná čísla (celý obdélník) -->
  <rect x="10" y="10" width="580" height="280" rx="18" fill="#f4f1fa" stroke="#222" stroke-width="2"/>
  <text x="30" y="38" font-weight="bold">ℝ reálná čísla</text>
  <!-- Q – racionální -->
  <rect x="30" y="55" width="400" height="220" rx="16" fill="#e3eefa" stroke="#222" stroke-width="2"/>
  <text x="48" y="80" font-weight="bold">ℚ racionální</text>
  <text x="300" y="80" fill="#333">1/2  −0,75  0,3̅</text>
  <!-- Z – celá -->
  <rect x="50" y="95" width="240" height="160" rx="14" fill="#cfe2f5" stroke="#222" stroke-width="2"/>
  <text x="66" y="120" font-weight="bold">ℤ celá</text>
  <text x="200" y="120" fill="#333">−3  −1</text>
  <!-- N – přirozená -->
  <rect x="70" y="140" width="130" height="95" rx="12" fill="#a9cbee" stroke="#222" stroke-width="2"/>
  <text x="84" y="165" font-weight="bold">ℕ přirozená</text>
  <text x="90" y="205" fill="#333">1  2  3 …</text>
  <text x="240" y="205" fill="#333">0</text>
  <!-- iracionální čísla: v R, ale mimo Q -->
  <text x="450" y="110" font-weight="bold">iracionální</text>
  <text x="460" y="150" fill="#333">√2</text>
  <text x="510" y="185" fill="#333">π</text>
  <text x="455" y="220" fill="#333">√3</text>
</svg>
