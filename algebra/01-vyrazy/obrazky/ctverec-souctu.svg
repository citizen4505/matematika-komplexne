<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" font-family="sans-serif" font-size="18">
  <title>Čtverec o straně a + b rozdělený na čtverec a², čtverec b² a dva obdélníky ab</title>
  <!-- bílé pozadí kvůli tmavému režimu GitHubu -->
  <rect width="360" height="330" fill="#ffffff"/>
  <!-- strana a = 180 px, b = 90 px; čtverec začíná v bodě (50, 40) -->
  <rect x="50"  y="40"  width="180" height="180" fill="#7fb3e6" stroke="#222" stroke-width="2"/>
  <rect x="230" y="40"  width="90"  height="180" fill="#f0b27a" stroke="#222" stroke-width="2"/>
  <rect x="50"  y="220" width="180" height="90"  fill="#f0b27a" stroke="#222" stroke-width="2"/>
  <rect x="230" y="220" width="90"  height="90"  fill="#a3d9a5" stroke="#222" stroke-width="2"/>
  <!-- obsahy dílů -->
  <g text-anchor="middle" fill="#222">
    <text x="140" y="137" font-size="24">a²</text>
    <text x="275" y="137">ab</text>
    <text x="140" y="272">ab</text>
    <text x="275" y="272">b²</text>
    <!-- popisky stran nahoře a vlevo -->
    <text x="140" y="28">a</text>
    <text x="275" y="28">b</text>
  </g>
  <g text-anchor="end" fill="#222">
    <text x="40" y="137">a</text>
    <text x="40" y="272">b</text>
  </g>
</svg>
