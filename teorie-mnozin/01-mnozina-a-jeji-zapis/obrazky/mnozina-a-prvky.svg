<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" font-family="sans-serif" font-size="20">
  <title>Množina A nakreslená jako ovál s prvky 1, 2, 3 a 4; čísla 7 a 9 leží mimo ni</title>
  <!-- bílé pozadí kvůli tmavému režimu GitHubu -->
  <rect width="420" height="200" fill="#ffffff"/>
  <!-- množina A -->
  <ellipse cx="160" cy="105" rx="120" ry="75" fill="#d6e6f5" stroke="#1f5fa8" stroke-width="2"/>
  <text x="55" y="45" font-weight="bold" fill="#1f5fa8">A</text>
  <!-- prvky uvnitř: patří do A -->
  <g text-anchor="middle" fill="#222">
    <text x="110" y="95">1</text><text x="200" y="90">2</text>
    <text x="130" y="145">3</text><text x="215" y="140">4</text>
  </g>
  <!-- prvky vně: nepatří do A -->
  <g text-anchor="middle" fill="#c0392b">
    <text x="345" y="80">7</text><text x="375" y="150">9</text>
  </g>
  <!-- legenda -->
  <g font-size="14" fill="#222">
    <text x="300" y="185">3 ∈ A,  7 ∉ A</text>
  </g>
</svg>
