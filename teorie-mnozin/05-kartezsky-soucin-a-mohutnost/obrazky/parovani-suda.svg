<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" width="520" height="170" font-family="sans-serif" font-size="16">
  <title>Párování přirozených čísel 1, 2, 3, 4, 5 se sudými čísly 2, 4, 6, 8, 10</title>
  <rect width="520" height="170" fill="#ffffff"/>
  <defs><marker id="sipka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <text x="15" y="45" font-weight="bold" fill="#1f5fa8">ℕ</text>
  <text x="15" y="140" font-weight="bold" fill="#c0392b">S</text>
  <text x="135" y="45" text-anchor="middle" fill="#1f5fa8" font-size="18">1</text>
  <line x1="135" y1="55" x2="135" y2="115" stroke="#555" stroke-width="2" marker-end="url(#sipka)"/>
  <text x="135" y="140" text-anchor="middle" fill="#c0392b" font-size="18">2</text>
  <text x="210" y="45" text-anchor="middle" fill="#1f5fa8" font-size="18">2</text>
  <line x1="210" y1="55" x2="210" y2="115" stroke="#555" stroke-width="2" marker-end="url(#sipka)"/>
  <text x="210" y="140" text-anchor="middle" fill="#c0392b" font-size="18">4</text>
  <text x="285" y="45" text-anchor="middle" fill="#1f5fa8" font-size="18">3</text>
  <line x1="285" y1="55" x2="285" y2="115" stroke="#555" stroke-width="2" marker-end="url(#sipka)"/>
  <text x="285" y="140" text-anchor="middle" fill="#c0392b" font-size="18">6</text>
  <text x="360" y="45" text-anchor="middle" fill="#1f5fa8" font-size="18">4</text>
  <line x1="360" y1="55" x2="360" y2="115" stroke="#555" stroke-width="2" marker-end="url(#sipka)"/>
  <text x="360" y="140" text-anchor="middle" fill="#c0392b" font-size="18">8</text>
  <text x="435" y="45" text-anchor="middle" fill="#1f5fa8" font-size="18">5</text>
  <line x1="435" y1="55" x2="435" y2="115" stroke="#555" stroke-width="2" marker-end="url(#sipka)"/>
  <text x="435" y="140" text-anchor="middle" fill="#c0392b" font-size="18">10</text>
  <text x="510" y="45" text-anchor="end" fill="#555">…</text>
  <text x="510" y="140" text-anchor="end" fill="#555">…</text>
  <text x="260" y="165" text-anchor="middle" font-size="14" fill="#555">n ↦ 2n</text>
</svg>
