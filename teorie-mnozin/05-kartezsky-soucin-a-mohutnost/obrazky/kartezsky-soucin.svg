<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" width="420" height="250" font-family="sans-serif" font-size="16">
  <title>Kartézský součin množin A = {1, 2, 3} a B = {x, y} jako mřížka šesti bodů</title>
  <rect width="420" height="250" fill="#ffffff"/>
  <defs><marker id="sipka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <line x1="60" y1="200" x2="390" y2="200" stroke="#222" stroke-width="2" marker-end="url(#sipka)"/>
  <line x1="60" y1="200" x2="60" y2="20" stroke="#222" stroke-width="2" marker-end="url(#sipka)"/>
  <text x="395" y="220" font-weight="bold" fill="#1f5fa8">A</text>
  <text x="30" y="28" font-weight="bold" fill="#c0392b">B</text>
  <text x="150" y="225" text-anchor="middle" fill="#1f5fa8">1</text>
  <text x="45" y="140" text-anchor="end" fill="#c0392b">x</text>
  <circle cx="150" cy="135" r="6" fill="#222"/>
  <text x="160" y="125" font-size="14" fill="#222">[1, x]</text>
  <text x="45" y="75" text-anchor="end" fill="#c0392b">y</text>
  <circle cx="150" cy="70" r="6" fill="#222"/>
  <text x="160" y="60" font-size="14" fill="#222">[1, y]</text>
  <text x="240" y="225" text-anchor="middle" fill="#1f5fa8">2</text>
  <circle cx="240" cy="135" r="6" fill="#222"/>
  <text x="250" y="125" font-size="14" fill="#222">[2, x]</text>
  <circle cx="240" cy="70" r="6" fill="#222"/>
  <text x="250" y="60" font-size="14" fill="#222">[2, y]</text>
  <text x="330" y="225" text-anchor="middle" fill="#1f5fa8">3</text>
  <circle cx="330" cy="135" r="6" fill="#222"/>
  <text x="340" y="125" font-size="14" fill="#222">[3, x]</text>
  <circle cx="330" cy="70" r="6" fill="#222"/>
  <text x="340" y="60" font-size="14" fill="#222">[3, y]</text>
</svg>
