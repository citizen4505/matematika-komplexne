<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100" font-family="sans-serif" font-size="16">
  <title>Interval od −1 do 3 na číselné ose, −1 prázdný kroužek, 3 plný kroužek</title>
  <rect width="520" height="100" fill="#ffffff"/>
  <defs>
    <marker id="sipka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <!-- osa: dílek 60 px, −3 na x=40, 0 na x=220, 4 na x=460 -->
  <line x1="15" y1="55" x2="505" y2="55" stroke="#222" stroke-width="2" marker-end="url(#sipka)"/>
  <g stroke="#222" stroke-width="2">
    <line x1="40" y1="48" x2="40" y2="62"/><line x1="100" y1="48" x2="100" y2="62"/>
    <line x1="160" y1="48" x2="160" y2="62"/><line x1="220" y1="45" x2="220" y2="65"/>
    <line x1="280" y1="48" x2="280" y2="62"/><line x1="340" y1="48" x2="340" y2="62"/>
    <line x1="400" y1="48" x2="400" y2="62"/><line x1="460" y1="48" x2="460" y2="62"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="40" y="88">−3</text><text x="100" y="88">−2</text><text x="160" y="88">−1</text>
    <text x="220" y="88">0</text><text x="280" y="88">1</text><text x="340" y="88">2</text>
    <text x="400" y="88">3</text><text x="460" y="88">4</text>
  </g>
  <!-- zvýrazněný úsek intervalu -->
  <line x1="160" y1="55" x2="400" y2="55" stroke="#1f5fa8" stroke-width="6"/>
  <!-- −1 nepatří: prázdný kroužek; 3 patří: plný kroužek -->
  <circle cx="160" cy="55" r="7" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/>
  <circle cx="400" cy="55" r="7" fill="#1f5fa8" stroke="#1f5fa8" stroke-width="3"/>
  <text x="280" y="30" text-anchor="middle" fill="#1f5fa8" font-weight="bold">(−1, 3⟩</text>
</svg>
