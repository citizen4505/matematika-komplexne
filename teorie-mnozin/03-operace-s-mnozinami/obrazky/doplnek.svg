<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" width="360" height="210" font-family="sans-serif" font-size="18">
  <title>Doplněk množiny A: vybarvená je část základní množiny Z mimo kruh A</title>
  <rect width="360" height="210" fill="#ffffff"/>
  <!-- základní množina Z celá vybarvená -->
  <rect x="10" y="10" width="340" height="170" fill="#7fb3e6" stroke="#222" stroke-width="2"/>
  <!-- kruh A bílý: do doplňku nepatří -->
  <circle cx="180" cy="95" r="60" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="22" y="34" font-weight="bold">Z</text>
  <text x="172" y="101" font-weight="bold">A</text>
  <text x="180" y="202" text-anchor="middle" font-size="16" fill="#222">doplněk A′ = Z \ A</text>
</svg>
