<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" width="400" height="230" font-family="sans-serif" font-size="18">
  <title>Vennův diagram množin A a B s prvky 1 až 6</title>
  <rect width="400" height="230" fill="#ffffff"/>
  <!-- základní množina Z jako obdélník -->
  <rect x="10" y="10" width="380" height="210" fill="none" stroke="#222" stroke-width="2"/>
  <text x="22" y="34" font-weight="bold">Z</text>
  <!-- kruhy A (vlevo) a B (vpravo), poloměr 80 -->
  <circle cx="155" cy="120" r="80" fill="#7fb3e6" fill-opacity="0.45" stroke="#1f5fa8" stroke-width="2"/>
  <circle cx="245" cy="120" r="80" fill="#f2a97c" fill-opacity="0.45" stroke="#c0392b" stroke-width="2"/>
  <text x="95" y="52" font-weight="bold" fill="#1f5fa8">A</text>
  <text x="295" y="52" font-weight="bold" fill="#c0392b">B</text>
  <!-- prvky: 1,2 jen v A; 3,4 v obou; 5 jen v B; 6 mimo -->
  <g text-anchor="middle" fill="#222">
    <text x="120" y="110">1</text><text x="125" y="150">2</text>
    <text x="200" y="110">3</text><text x="200" y="150">4</text>
    <text x="280" y="130">5</text>
    <text x="365" y="205">6</text>
  </g>
</svg>
