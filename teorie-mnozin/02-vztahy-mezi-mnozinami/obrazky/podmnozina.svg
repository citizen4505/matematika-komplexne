<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" font-family="sans-serif" font-size="20">
  <title>Vennův diagram: kruh B leží celý uvnitř kruhu A</title>
  <rect width="360" height="240" fill="#ffffff"/>
  <!-- větší množina A -->
  <circle cx="180" cy="110" r="95" fill="#d6e6f5" stroke="#1f5fa8" stroke-width="2"/>
  <!-- menší množina B uvnitř A -->
  <circle cx="200" cy="125" r="50" fill="#f2a97c" fill-opacity="0.7" stroke="#c0392b" stroke-width="2"/>
  <text x="105" y="65" font-weight="bold" fill="#1f5fa8">A</text>
  <text x="192" y="132" font-weight="bold" fill="#c0392b">B</text>
  <text x="180" y="232" text-anchor="middle" font-size="16" fill="#222">B ⊂ A</text>
</svg>
